spring:

  datasource:
    url: jdbc:mariadb://mariadb_cdc:3306/logisticsdb
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:logistics}
    password: ${DB_PASSWORD:logistics1pass}

  sql:
    init:
      mode: always

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: none
    show-sql: false

  h2:
    console:
      enabled: false

app:

  security:
    enable-login: true

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 28800000
