spring:

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:logisticsdb}
    driver-class-name: org.mariadb.jdbc.Driver
    username: ${DB_USERNAME:logistics}
    password: ${DB_PASSWORD:logistics1pass}

  sql:
    init:
      mode: always

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: none
    show-sql: false

app:

  security:
    enable-login: true
    cors-allowed-origins:
      - http://localhost:4200
      - http://192.168.1.3:4200
      - https://teixeiradas.ddns.net
      - https://*.vercel.app

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 28800000
