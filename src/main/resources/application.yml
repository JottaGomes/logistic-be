spring:

  datasource:
    url: jdbc:h2:mem:logisticsdb;MODE=MySQL # mode mysql so H2 supports the syntax in data.sql
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

app:

  security:
    enable-login: true
    cors-allowed-origins:
      - http://localhost:4200
      - http://192.168.1.3:4200
      - https://teixeiradas.ddns.net
      - https://*.vercel.app

  jwt:
    secret: dachser-logistics-super-secret-key-32-chars-min
    expiration-ms: 28800000
