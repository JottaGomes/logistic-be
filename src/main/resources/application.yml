spring:

  # embedded in-memory database, so the project builds and runs with no external
  # dependency; see application-mariadb.yml for the persistent alternative
  datasource:
    url: jdbc:h2:mem:logisticsdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:

  security:
    enable-login: true
    cors-allowed-origins:
      - http://localhost:4200
      - http://192.168.1.3:4200
      - https://teixeiradas.ddns.net
      - https://*.vercel.app

  jwt:
    secret: ${JWT_SECRET:dachser-logistics-super-secret-key-32-chars-min}
    expiration-ms: 28800000
