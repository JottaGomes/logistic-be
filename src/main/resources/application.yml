spring:

  # embedded in-memory database, so the project builds and runs with no external
  # dependency; see application-mariadb.yml for the persistent alternative
  datasource:
    url: jdbc:h2:mem:logisticsdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

app:

  seed:
    # Generated shipments written at startup, on top of the four in data.sql.
    # Set to 0 to start with only the hand-written ones; the environment variable
    # APP_SEED_BULK_SHIPMENTS overrides this without touching the file.
    bulk-shipments: 10000

  security:
    enable-login: true
    # Comma-separated origin patterns allowed to call the API from a browser.
    # Defaults to the Angular development server and the front end's Vercel
    # deployments (production and preview URLs alike). A deployment served from
    # any other host lists it in CORS_ALLOWED_ORIGINS, which replaces this list.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.vercel.app}

  chat:
    # Groq API key for the shipment chat assistant (/api/chat). Supply it through the
    # GROQ_API_KEY environment variable rather than writing it here: this file is
    # committed. Without a key, only /api/chat is unavailable (503).
    api-key: ${GROQ_API_KEY:}
    model: openai/gpt-oss-120b

  jwt:
    # Signing key, at least 32 characters. Left empty, a random key is generated at
    # startup and every issued token stops being valid when the application restarts.
    secret: ${JWT_SECRET:}
    expiration-ms: 28800000
